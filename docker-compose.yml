# AVAP — PostgreSQL + FastAPI backend (with Nmap) + Next.js UI.
#
# Configuration comes from a root-level `.env` file (copy env.docker.example
# to `.env` and edit). See README.md for the complete guide.
#
# Set in the Dokploy Environment tab (or a local .env file):
#
#   POSTGRES_PASSWORD   database password
#   FRONTEND_DOMAIN     UI hostname   e.g. avap.rentrik.in
#   BACKEND_DOMAIN      API hostname  e.g. api-avap.rentrik.in
#   OPENROUTER_API_KEY  optional; blank disables AI remediation only
#
# Hostnames only — no scheme, no trailing slash. BACKEND_DOMAIN is compiled
# into the browser bundle at BUILD time, so changing it needs a Redeploy,
# not a Restart.
#
# Running it outside Dokploy: `docker network create dokploy-network` once,
# then `docker compose up -d --build`.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avap}
      POSTGRES_USER: ${POSTGRES_USER:-avap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - avap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avap_user} -d ${POSTGRES_DB:-avap}"]
      interval: 5s
      timeout: 3s
      retries: 12
    # Default network only — never reachable from Traefik or the internet.

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: "false"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-avap}
      POSTGRES_USER: ${POSTGRES_USER:-avap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # New accounts allowed per client IP per hour (open registration).
      REGISTRATIONS_PER_IP_PER_HOUR: ${REGISTRATIONS_PER_IP_PER_HOUR:-10}
      # Auth secrets: no defaults, the backend refuses to start without them.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY in .env}
      # Raw scan output: "local" (the avap_storage volume) or "s3".
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-AES256}
      # Read by boto3 directly (or use an IAM role and leave these empty).
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      SCAN_TIMEOUT: ${SCAN_TIMEOUT:-900}
      NMAP_SCAN_MODE: ${NMAP_SCAN_MODE:-auto}
      # Users supply their own OpenRouter keys in the app; free models only.
      AI_PROVIDER: openrouter
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemma-4-31b-it:free}
      OPENROUTER_DATA_COLLECTION: ${OPENROUTER_DATA_COLLECTION:-allow}
      AI_FINDINGS_IN_RISK: ${AI_FINDINGS_IN_RISK:-false}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-60}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-1024}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - avap_scan_output:/data/scan_output
      - avap_storage:/data/storage
      - avap_reports:/data/generated_reports
      - avap_logs:/data/logs
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    cap_add:
      - NET_RAW

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the browser bundle at build time (NEXT_PUBLIC_*). The
        # browser calls the API directly, so this must be the public https
        # URL — an http URL is blocked as mixed content on an https page.
        NEXT_PUBLIC_API_BASE_URL: https://${BACKEND_DOMAIN:?Set BACKEND_DOMAIN}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"

volumes:
  avap_pgdata:
  avap_scan_output:
  avap_storage:
  avap_reports:
  avap_logs:
