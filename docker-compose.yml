# AVAP — full stack: PostgreSQL + FastAPI backend (with Nmap) + Next.js UI.
#
# Configuration comes from a root-level `.env` file (copy env.docker.example
# to `.env` and edit). See README.md for the complete guide.
#
# The frontend and backend only communicate over REST — the browser calls
# the backend directly at FRONTEND_API_BASE_URL, which is why that value is
# a *build* argument (NEXT_PUBLIC_* is baked into the browser bundle).

name: avap

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avap}
      POSTGRES_USER: ${POSTGRES_USER:-avap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - avap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avap_user} -d ${POSTGRES_DB:-avap}"]
      interval: 5s
      timeout: 3s
      retries: 12
    # Not published to the host by default — the backend reaches it on the
    # internal network. Uncomment to inspect the DB from the host:
    # ports:
    #   - "5432:5432"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: "false"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-avap}
      POSTGRES_USER: ${POSTGRES_USER:-avap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3001}
      # New accounts allowed per client IP per hour (open registration).
      REGISTRATIONS_PER_IP_PER_HOUR: ${REGISTRATIONS_PER_IP_PER_HOUR:-10}
      # Public deployment only (docker-compose.prod.yml): the secret Caddy
      # sends so the backend believes its client-IP header. Empty = off.
      TRUSTED_PROXY_SECRET: ${TRUSTED_PROXY_SECRET:-}
      # Comma-separated hosts/IPs/CIDRs that may be scanned. Empty = any.
      SCAN_TARGET_ALLOWLIST: ${SCAN_TARGET_ALLOWLIST:-}
      # Auth secrets: no defaults, the backend refuses to start without them.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY in .env}
      # Raw scan output: "local" (the avap_storage volume) or "s3".
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-AES256}
      # Read by boto3 directly (or use an IAM role and leave these empty).
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      SCAN_TIMEOUT: ${SCAN_TIMEOUT:-900}
      NMAP_SCAN_MODE: ${NMAP_SCAN_MODE:-auto}
      # Users supply their own OpenRouter keys in the app; free models only.
      AI_PROVIDER: openrouter
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemma-4-31b-it:free}
      OPENROUTER_DATA_COLLECTION: ${OPENROUTER_DATA_COLLECTION:-allow}
      AI_FINDINGS_IN_RISK: ${AI_FINDINGS_IN_RISK:-false}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-60}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-1024}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Data directories are fixed inside the image (/data/...) — see
      # backend/Dockerfile. They persist via the named volumes below.
    volumes:
      - avap_scan_output:/data/scan_output
      - avap_storage:/data/storage
      - avap_reports:/data/generated_reports
      - avap_logs:/data/logs
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    cap_add:
      - NET_RAW

  frontend:
    build:
      context: ./frontend
      args:
        # URL the BROWSER uses to reach the backend — usually the host
        # machine's address + the published backend port, NOT "backend:8000".
        NEXT_PUBLIC_API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"

volumes:
  avap_pgdata:
  avap_scan_output:
  avap_storage:
  avap_reports:
  avap_logs:
